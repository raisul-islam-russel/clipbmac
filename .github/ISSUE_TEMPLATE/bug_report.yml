name: Bug report
description: Something in ClipBMac is not working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text
        2. Press the hotkey
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.5"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipBMac version
      placeholder: "1.0.0"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, which app you were pasting into, whether Accessibility permission is granted.
